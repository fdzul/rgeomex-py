site_name: rgeomex
site_description: Geographic boundaries of Mexico (INEGI, INE) for Python, downloaded on demand
site_url: https://fdzul.github.io/rgeomex-py/
repo_url: https://github.com/fdzul/rgeomex-py
repo_name: fdzul/rgeomex-py
copyright: Felipe Antonio Dzul Manzanilla · MIT license

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Guide:
      - Getting Started: getting-started.md
      - Examples: examples.md
      - Datasets: datasets.md
  - Reference: reference.md
  - About:
      - Citation: citation.md
      - Changelog: changelog.md
      - License: license.md
  - Español: es.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            heading_level: 3

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
